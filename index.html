<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Furlan Academy</title>
<meta name="description" content="Vídeos, leituras e atividades da turma, organizados por matéria.">
<meta name="theme-color" content="#070C18">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">

<!-- KaTeX: transforma $x^2$ em matemática de verdade -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<style>
:root{
  --fundo:#080D1A;
  --superficie:#111A2E;
  --superficie-2:#18233C;
  --borda:#243149;
  --borda-forte:#33456A;

  --texto:#E5EAF4;
  --texto-2:#98A5BE;
  --texto-3:#697591;

  --verde:#3ECF8E;
  --verde-fraco:rgba(62,207,142,.14);
  --verde-marca:rgba(62,207,142,.26);
  --azul:#5C8AF5;
  --azul-fraco:rgba(92,138,245,.14);

  --errado:#FF7A6B;
  --errado-fraco:rgba(255,122,107,.12);

  --pauta:30px;
  --raio:14px;
  --brilho:0 0 0 1px rgba(62,207,142,.22), 0 10px 40px -18px rgba(62,207,142,.5);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--fundo);color:var(--texto);
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
a{color:var(--verde)}
:focus-visible{outline:2px solid var(--verde);outline-offset:3px;border-radius:5px}
::selection{background:var(--verde-marca);color:#fff}

.envelope{width:min(1060px,100% - 40px);margin-inline:auto}
.rotulo{font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--texto-3)}

.katex{color:inherit;font-size:1.04em}
.katex-display{margin:calc(var(--pauta) / 2) 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}

.marca{
  background-image:linear-gradient(var(--verde-marca),var(--verde-marca));
  background-repeat:no-repeat;background-position:0 76%;
  background-size:100% .5em;padding:0 .12em;color:#fff;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
}
.marca--anima{animation:pincelar .7s cubic-bezier(.2,.7,.3,1) .25s both}
@keyframes pincelar{from{background-size:0% .5em}to{background-size:100% .5em}}

/* topo */
.topo{background:rgba(7,12,24,.86);backdrop-filter:blur(12px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--borda)}
.topo .envelope{display:flex;align-items:center;gap:16px;height:62px}
.marca-nome{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--texto);margin-right:auto}
.selo-f{
  width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(145deg,var(--verde),#2AA8C9);
  display:grid;place-items:center;font-weight:800;font-size:17px;color:#06231A;
  transform:rotate(-4deg);box-shadow:0 0 18px -4px rgba(62,207,142,.6);
}
.marca-nome b{font-weight:800;font-size:19px;letter-spacing:-.025em}
.topo nav{display:flex;gap:4px}
.topo nav a{color:var(--texto-2);text-decoration:none;font-size:14px;font-weight:500;padding:8px 13px;border-radius:8px}
.topo nav a:hover{background:var(--superficie-2);color:var(--texto)}
.topo nav a.ativo{background:var(--verde-fraco);color:var(--verde)}

main{padding:36px 0 80px;min-height:65vh}
.rodape{border-top:1px solid var(--borda);padding:26px 0;color:var(--texto-3);font-size:13px}

.migalha{font-size:13px;color:var(--texto-3);margin:0 0 16px;line-height:1.9}
.migalha a{color:var(--texto-2);text-decoration:none;border-bottom:1px solid var(--borda-forte)}
.migalha a:hover{color:var(--verde);border-color:var(--verde)}

/* capa */
.capa{
  background:
    radial-gradient(120% 140% at 88% -10%, rgba(92,138,245,.22), transparent 58%),
    radial-gradient(90% 120% at 4% 110%, rgba(62,207,142,.16), transparent 60%),
    repeating-linear-gradient(to bottom,transparent 0 33px,rgba(255,255,255,.035) 33px 34px),
    var(--superficie);
  border:1px solid var(--borda);border-radius:20px;
  padding:60px 48px 56px 78px;position:relative;overflow:hidden;margin-bottom:44px;
}
.capa::before{content:"";position:absolute;left:46px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,transparent,var(--verde),transparent);opacity:.55}
.capa .rotulo{color:var(--verde);margin-bottom:14px}
.capa h1{font-size:clamp(32px,5.6vw,52px);line-height:1.06;letter-spacing:-.035em;font-weight:800;margin:0 0 18px;max-width:15ch;color:#fff}
.capa p{margin:0;color:var(--texto-2);font-size:16.5px;max-width:48ch}
@media (max-width:600px){.capa{padding:40px 26px 38px 46px;border-radius:16px}.capa::before{left:24px}}

.titulo-secao{display:flex;align-items:baseline;gap:12px;margin:0 0 18px;padding-bottom:12px;border-bottom:1px solid var(--borda)}
.titulo-secao h2{font-size:15px;font-weight:600;margin:0;color:var(--texto)}
.titulo-secao span{font-size:13px;color:var(--texto-3)}

.grade{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(285px,1fr))}
.materia{
  display:flex;flex-direction:column;text-decoration:none;color:inherit;
  background:var(--superficie);border:1px solid var(--borda);
  border-top:4px solid var(--cor,var(--verde));border-radius:var(--raio);
  padding:22px 22px 20px;position:relative;overflow:hidden;
  transition:transform .2s cubic-bezier(.2,.7,.3,1),border-color .2s ease,background .2s ease;
}
.materia::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 90% at 50% -20%, var(--cor,var(--verde)), transparent 70%);opacity:.09;transition:opacity .2s ease}
.materia:hover,.materia:focus-visible{transform:translateY(-4px);background:var(--superficie-2);border-color:var(--borda-forte);border-top-color:var(--cor,var(--verde))}
.materia:hover::after{opacity:.18}
.materia h3{font-size:22px;font-weight:700;letter-spacing:-.025em;margin:0 0 8px;color:#fff}
.materia p{margin:0 0 18px;font-size:14.5px;color:var(--texto-2);line-height:1.5}
.materia .pe{margin-top:auto;display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;color:var(--cor,var(--verde))}
.materia .pe i{width:20px;height:1.5px;background:currentColor;display:block;transition:width .2s ease}
.materia:hover .pe i{width:34px}

.cabeca{
  background:var(--superficie);border:1px solid var(--borda);
  border-left:5px solid var(--cor,var(--verde));border-radius:var(--raio);
  padding:28px 30px;margin-bottom:30px;
}
.cabeca .rotulo{color:var(--cor,var(--texto-3));margin-bottom:10px}
.cabeca h1{font-size:clamp(28px,4.6vw,40px);letter-spacing:-.035em;margin:0 0 8px;color:#fff}
.cabeca p{margin:0;color:var(--texto-2);font-size:15.5px;max-width:60ch}

/* ============================================================
   NÍVEL 2 — lista de assuntos dentro da matéria
   ============================================================ */
.assuntos{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.assuntos a{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px 18px;
  text-decoration:none;color:inherit;background:var(--superficie);
  border:1px solid var(--borda);border-radius:12px;padding:20px 22px;
  transition:border-color .18s ease,transform .18s ease,background .18s ease;
}
.assuntos a:hover,.assuntos a:focus-visible{border-color:var(--cor,var(--verde));transform:translateX(3px);background:var(--superficie-2)}
.assuntos .num{
  grid-row:1/3;font-size:13px;font-weight:700;color:#08121F;background:var(--cor,var(--verde));
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-variant-numeric:tabular-nums;
}
.assuntos .tit{font-size:19px;font-weight:700;letter-spacing:-.02em;color:#fff}
.assuntos .sub{font-size:14px;color:var(--texto-2);grid-column:2}
.assuntos .seta{grid-row:1/3;color:var(--texto-3);font-size:20px}
.assuntos .selos{grid-column:2}

.selos{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.selo{
  font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  border-radius:99px;padding:3px 10px;background:var(--superficie-2);
  color:var(--texto-3);border:1px solid var(--borda);
}

/* ============================================================
   NÍVEL 3 — temas, com seus subtemas listados embaixo
   ============================================================ */
.tema{margin-bottom:34px}
.tema-cabeca{
  display:flex;align-items:baseline;gap:14px;margin-bottom:14px;
  padding-bottom:12px;border-bottom:1px solid var(--borda);flex-wrap:wrap;
}
.tema-num{
  font-size:12px;font-weight:700;color:var(--cor,var(--verde));
  border:1px solid var(--cor,var(--verde));border-radius:99px;
  padding:3px 11px;flex:none;letter-spacing:.05em;
}
.tema-cabeca h2{font-size:22px;font-weight:700;letter-spacing:-.025em;margin:0;color:#fff}
.tema-cabeca p{margin:0;font-size:14px;color:var(--texto-3);flex-basis:100%}

.subtemas{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.subtemas a{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 16px;
  text-decoration:none;color:inherit;background:var(--superficie);
  border:1px solid var(--borda);border-radius:11px;padding:15px 18px;
  transition:border-color .18s ease,transform .18s ease,background .18s ease;
}
.subtemas a:hover,.subtemas a:focus-visible{border-color:var(--cor,var(--verde));transform:translateX(3px);background:var(--superficie-2)}
.subtemas .marcador{
  grid-row:1/3;width:8px;height:8px;border-radius:50%;
  background:var(--cor,var(--verde));flex:none;
}
.subtemas .tit{font-size:16.5px;font-weight:600;color:#fff;letter-spacing:-.01em}
.subtemas .sub{font-size:13.5px;color:var(--texto-2);grid-column:2}
.subtemas .selos{grid-column:2;margin-top:7px}
.subtemas .seta{grid-row:1/3;color:var(--texto-3);font-size:18px}

/* ============================================================
   NÍVEL 4 — subtema, com as abas de conteúdo
   ============================================================ */
.subtema{max-width:760px}
.subtema > h1{font-size:clamp(27px,4.4vw,38px);letter-spacing:-.035em;line-height:1.14;margin:0 0 10px;color:#fff}
.subtema > .resumo{font-size:17px;color:var(--texto-2);margin:0 0 26px;max-width:58ch}

.abas{
  display:flex;gap:6px;position:sticky;top:62px;z-index:15;
  background:var(--fundo);padding:12px 0;margin-bottom:26px;
  border-bottom:1px solid var(--borda);overflow-x:auto;
}
.abas button{
  font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  color:var(--texto-2);padding:8px 16px;border-radius:99px;
  border:1px solid var(--borda);background:var(--superficie);
  display:flex;align-items:center;gap:8px;
}
.abas button:hover{color:var(--texto);border-color:var(--borda-forte)}
.abas button[aria-selected="true"]{background:var(--verde);border-color:var(--verde);color:#06231A}
.abas .conta{font-size:11px;font-weight:700;background:var(--superficie-2);color:var(--texto-3);border-radius:99px;padding:1px 7px}
.abas button[aria-selected="true"] .conta{background:rgba(6,35,26,.22);color:#06231A}
.painel-aba[hidden]{display:none}

.video{margin-bottom:26px}
.video h3{font-size:16px;font-weight:600;margin:0 0 10px;color:#fff}
.moldura{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#03060D;border:1px solid var(--borda)}
.moldura iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.link-video{
  display:inline-block;margin-top:9px;font-size:13px;font-weight:600;
  color:var(--texto-3);text-decoration:none;
}
.link-video:hover{color:var(--verde)}

.escrita{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio);padding:26px 26px 30px;margin-bottom:18px}
.escrita > h3{font-size:20px;font-weight:700;letter-spacing:-.02em;color:#fff;margin:0 0 18px}
.corpo{
  font-family:"Source Serif 4",Georgia,serif;font-size:17.5px;
  line-height:var(--pauta);color:#D5DCE9;
  background-image:repeating-linear-gradient(to bottom,transparent 0 calc(var(--pauta) - 1px),rgba(255,255,255,.055) calc(var(--pauta) - 1px) var(--pauta));
  background-position:0 31px;
}
.corpo > *{margin:0 0 var(--pauta)}
.corpo > *:last-child{margin-bottom:0}
.corpo h4{font-family:"Bricolage Grotesque",sans-serif;font-size:17px;font-weight:700;color:var(--verde);line-height:var(--pauta);margin-top:var(--pauta);letter-spacing:-.01em}
.corpo ul,.corpo ol{padding-left:24px}
.corpo li{margin:0;line-height:var(--pauta)}
.corpo li::marker{color:var(--texto-3)}
.corpo strong{font-weight:600;color:#fff}

/* recuo na primeira linha do parágrafo, como em texto impresso.
   Para desligar, apague este bloco de quatro linhas. */
.corpo p{text-indent:1.9em}
.corpo p:first-child,
.corpo h4 + p,
.corpo blockquote + p,
.corpo figure + p{text-indent:0}
.enunciado p + p{text-indent:1.9em}
.corpo em{font-style:italic;color:#EDF1F8}
.corpo code,.enunciado code,.resposta code,.alt code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;
  background:#0C1424;border:1px solid var(--borda);border-radius:5px;padding:1px 6px;color:var(--verde);
}
.enunciado strong,.resposta strong,.alt strong{font-weight:700;color:#fff}
.corpo img{max-width:100%;border-radius:10px;border:1px solid var(--borda);display:block}

/* atividades */
.questao{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio);padding:24px 22px;margin-bottom:14px}
.questao .ordem{margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tipo-selo{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--azul);background:var(--azul-fraco);border-radius:99px;padding:2px 9px}
.questao .enunciado{font-size:16.5px;line-height:1.6;margin:0 0 16px;color:var(--texto)}
.enunciado > *{margin:0 0 12px}
.enunciado > *:last-child{margin-bottom:0}
.enunciado h4{
  font-family:"Bricolage Grotesque",sans-serif;font-size:14px;font-weight:700;
  color:var(--verde);margin:18px 0 8px;letter-spacing:.02em;
}
.enunciado ul,.enunciado ol{padding-left:22px}
.enunciado li{margin:0 0 5px}
.resposta > *{margin:0 0 10px}
.resposta > *:last-child{margin-bottom:0}
.resposta h4{font-size:13.5px;font-weight:700;color:var(--verde);margin:14px 0 6px}
.resposta ul,.resposta ol{padding-left:20px}

figure.figura{margin:0 0 12px}
figure.figura img{
  display:block;max-width:100%;border-radius:10px;
  border:1px solid var(--borda);background:#0A1120;
}
figure.figura figcaption{
  margin-top:8px;font-family:"Bricolage Grotesque",sans-serif;
  font-size:13px;line-height:1.5;color:var(--texto-3);
}
.corpo figure.figura{margin-bottom:var(--pauta)}
.corpo figure.figura figcaption{line-height:1.5}

blockquote{
  margin:0 0 12px;padding:4px 0 4px 18px;
  border-left:3px solid var(--azul);color:var(--texto-2);
  font-family:"Source Serif 4",Georgia,serif;font-size:.97em;
}
.corpo blockquote{margin-bottom:var(--pauta);line-height:var(--pauta)}
.q-figura{max-width:100%;border-radius:10px;border:1px solid var(--borda);margin:0 0 18px;display:block}
.img-explicacao{
  display:block;max-width:100%;margin:14px 0 0;
  border-radius:9px;border:1px solid var(--borda);background:#0A1120;
}

.alternativas{display:flex;flex-direction:column;gap:9px}
.alt{
  display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  font:inherit;font-size:15.5px;line-height:1.5;color:var(--texto);
  background:var(--superficie-2);border:1px solid var(--borda);
  border-radius:10px;padding:13px 15px;cursor:pointer;
  transition:border-color .15s ease,background .15s ease;
}
.alt:hover:not(:disabled){border-color:var(--borda-forte);background:#1D2947}
.alt:disabled{cursor:default}
.alt .letra{font-weight:700;color:var(--texto-3);flex:none;width:20px}
.alt.marcada{border-color:var(--azul);background:var(--azul-fraco)}
.alt.marcada .letra{color:var(--azul)}
.alt.certa{border-color:var(--verde);background:var(--verde-fraco)}
.alt.certa .letra{color:var(--verde)}
.alt.certa .texto{
  background-image:linear-gradient(var(--verde-marca),var(--verde-marca));
  background-repeat:no-repeat;background-position:0 76%;background-size:100% .5em;
  animation:pincelar .55s cubic-bezier(.2,.7,.3,1) both;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;color:#fff;
}
.alt.errada{border-color:var(--errado);background:var(--errado-fraco)}
.alt.errada .letra{color:var(--errado)}
.alt.errada .texto{text-decoration:line-through;text-decoration-color:var(--errado);color:var(--texto-2)}

.linha-resposta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.linha-resposta input{font:inherit;font-size:17px;width:170px;color:var(--texto);background:#0C1424;border:1px solid var(--borda);border-radius:9px;padding:11px 14px}
.linha-resposta input:focus{outline:none;border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-fraco)}
.linha-resposta input:disabled{opacity:.7}
.unidade{color:var(--texto-2);font-size:15px}

.plano-caixa{background:#0A1120;border:1px solid var(--borda);border-radius:12px;padding:14px;display:inline-block;max-width:100%}
.plano-caixa svg{display:block;width:100%;max-width:340px;height:auto;touch-action:manipulation;cursor:crosshair}
.plano-caixa svg.travado{cursor:default}
.leitura-ponto{font-size:14px;color:var(--texto-2);margin-top:10px}
.leitura-ponto b{color:var(--verde);font-variant-numeric:tabular-nums}

.resposta{margin-top:16px;padding:15px 17px;border-radius:10px;font-size:14.5px;line-height:1.6;color:var(--texto-2);border-left:3px solid var(--azul);background:var(--azul-fraco)}
.resposta .veredito{display:block;font-weight:700;margin-bottom:3px}
.resposta.acertou{border-left-color:var(--verde);background:var(--verde-fraco)}
.resposta.acertou .veredito{color:var(--verde)}
.resposta.errou{border-left-color:var(--errado);background:var(--errado-fraco)}
.resposta.errou .veredito{color:var(--errado)}

.placar{margin-top:20px;padding:20px 22px;border-radius:var(--raio);background:var(--superficie);border:1px solid var(--borda-forte);font-size:17px;font-weight:600;color:#fff;box-shadow:var(--brilho)}
.placar span{display:block;margin-top:4px;font-weight:400;font-size:14px;color:var(--texto-2)}

.navegacao{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.avancar{
  display:inline-flex;align-items:center;gap:9px;
  background:var(--verde);color:#06231A;text-decoration:none;
  padding:14px 24px;border-radius:10px;font-weight:700;font-size:15px;
}
.avancar:hover{background:#57E0A3}
.voltar{
  display:inline-flex;align-items:center;gap:9px;
  background:var(--superficie);color:var(--texto-2);text-decoration:none;
  border:1px solid var(--borda);padding:14px 22px;border-radius:10px;font-weight:600;font-size:15px;
}
.voltar:hover{border-color:var(--borda-forte);color:var(--texto)}
.vazio{color:var(--texto-3);font-size:15px;font-style:italic}

.convite{
  background:var(--superficie);border:1px dashed var(--borda-forte);
  border-radius:var(--raio);padding:40px 32px;text-align:center;
}

<body>

<header class="topo">
  <div class="envelope">
    <a class="marca-nome" href="#/"><span class="selo-f">F</span><b>Furlan Academy</b></a>
    <nav>
      <a href="#/" id="nav-inicio">Matérias</a>
      <a href="#/criar" id="nav-criar">Criar aula</a>
    </nav>
  </div>
</header>

<main id="app" class="envelope"></main>

<footer class="rodape">
  <div class="envelope">Furlan Academy — feito pela turma, para a turma.</div>
</footer>


<!-- O conteúdo mora no conteudo.js, na mesma pasta -->
<script src="conteudo.js"></script>


<!-- ==================================================================
     MOTOR DO SITE — daqui pra baixo não precisa mexer
     ================================================================== -->
<script>
const app = document.getElementById("app");

/* o conteudo.js precisa ter carregado antes deste bloco */
if(typeof MATERIAS === "undefined"){
  app.innerHTML = `
    <section class="capa">
      <div class="rotulo">Erro de carregamento</div>
      <h1>O arquivo conteudo.js não foi encontrado.</h1>
      <p>Ele precisa estar na mesma pasta que o index.html, com esse nome exato e
      tudo em minúsculas. Se o nome estiver certo, o problema está dentro dele —
      abra o Console com F12 que a mensagem vermelha aponta a linha.</p>
    </section>`;
  throw new Error("conteudo.js nao carregou");
}


function esc(t){
  return String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
function plural(n,um,muitos){ return n + " " + (n === 1 ? um : muitos); }

/* embaralha uma lista sem alterar a original (Fisher-Yates) */
function embaralharLista(lista){
  const copia = lista.slice();
  for(let i = copia.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}

/* ---------- buscas na árvore ---------- */
function acharMateria(id){ return MATERIAS.find(m => m.id === id); }
function acharAssunto(m,id){ return m ? (m.assuntos || []).find(a => a.id === id) : null; }
function acharTema(as,id){ return as ? (as.temas || []).find(t => t.id === id) : null; }
function acharSubtema(t,id){ return t ? (t.subtemas || []).find(s => s.id === id) : null; }

/* todos os subtemas de um assunto, em ordem, com o tema de cada um */
function listarSubtemas(assunto){
  const saida = [];
  (assunto.temas || []).forEach(t => (t.subtemas || []).forEach(s => saida.push({tema:t, subtema:s})));
  return saida;
}
function contarSubtemas(assunto){ return listarSubtemas(assunto).length; }
function contarNaMateria(m){
  return (m.assuntos || []).reduce((s,a) => s + contarSubtemas(a), 0);
}

function apelidar(texto){
  return String(texto).normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60);
}

function codigoDoVideo(entrada){
  const t = String(entrada).trim();
  if(!t) return "";
  const m = t.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : t.replace(/[^A-Za-z0-9_-]/g,"");
}

function selosDe(s){
  const lista = [];
  if((s.videos || []).length)     lista.push(plural(s.videos.length,"vídeo","vídeos"));
  if((s.escritas || []).length)   lista.push(plural(s.escritas.length,"leitura","leituras"));
  if((s.atividades || []).length) lista.push(plural(s.atividades.length,"atividade","atividades"));
  return lista.length ? `<span class="selos">${lista.map(x => `<span class="selo">${esc(x)}</span>`).join("")}</span>` : "";
}

/* ---------- KaTeX ---------- */
function renderizarMatematica(alvo){
  if(typeof window.renderMathInElement !== "function") return;
  try{
    window.renderMathInElement(alvo || app, {
      delimiters:[
        {left:"$$", right:"$$", display:true},
        {left:"\\[", right:"\\]", display:true},
        {left:"$",  right:"$",  display:false},
        {left:"\\(", right:"\\)", display:false}
      ],
      throwOnError:false,
      ignoredTags:["script","noscript","style","textarea","pre","code","option"]
    });
  }catch(e){ /* sem KaTeX o texto aparece cru, o site não quebra */ }
}
window.addEventListener("load", () => renderizarMatematica());

/* ============================================================
   NÍVEL 1 — capa
   ============================================================ */
function telaCapa(){
  const total = MATERIAS.reduce((s,m) => s + contarNaMateria(m), 0);
  const cartoes = MATERIAS.map(m => `
    <a class="materia" href="#/m/${esc(m.id)}" style="--cor:${esc(m.cor)}">
      <h3>${esc(m.nome)}</h3>
      <p>${esc(m.descricao)}</p>
      <span class="pe"><i></i> ${plural(contarNaMateria(m),"aula","aulas")}</span>
    </a>`).join("");

  app.innerHTML = `
    <section class="capa">
      <div class="rotulo">Furlan Academy</div>
      <h1>Tudo que a turma estudou, <span class="marca marca--anima">num lugar só</span>.</h1>
      <p>Escolha uma matéria, assista, leia e teste se entendeu. Sem login e sem prazo.</p>
    </section>
    ${MATERIAS.length ? `
      <div class="titulo-secao">
        <h2>Matérias</h2>
        <span>${plural(total,"aula","aulas")} no total</span>
      </div>
      <div class="grade">${cartoes}</div>` : `
      <div class="convite">
        <h2>O site está vazio — e é assim que começa.</h2>
        <p>Vá em <a href="#/criar">Criar aula</a>, monte a primeira matéria e cole o código
        gerado no index.html. Depois é só recarregar esta página.</p>
      </div>`}`;
  document.title = "Furlan Academy";
}

/* ============================================================
   NÍVEL 2 — matéria mostra seus assuntos
   ============================================================ */
function telaMateria(idMateria){
  const m = acharMateria(idMateria);
  if(!m) return telaErro();
  const lista = m.assuntos || [];

  const itens = lista.map((a,i) => {
    const temas = (a.temas || []).length;
    const aulas = contarSubtemas(a);
    return `
      <li>
        <a href="#/as/${esc(m.id)}/${esc(a.id)}" style="--cor:${esc(m.cor)}">
          <span class="num">${String(i + 1).padStart(2,"0")}</span>
          <span class="tit">${esc(a.titulo)}</span>
          <span class="seta">→</span>
          <span class="sub">${esc(a.resumo || "")}</span>
          <span class="selos">
            <span class="selo">${plural(temas,"tema","temas")}</span>
            <span class="selo">${plural(aulas,"aula","aulas")}</span>
          </span>
        </a>
      </li>`;
  }).join("");

  app.innerHTML = `
    <p class="migalha"><a href="#/">Matérias</a> · ${esc(m.nome)}</p>
    <div class="cabeca" style="--cor:${esc(m.cor)}">
      <div class="rotulo">${plural(lista.length,"assunto","assuntos")}</div>
      <h1>${esc(m.nome)}</h1>
      <p>${esc(m.descricao)}</p>
    </div>
    ${lista.length ? `<ul class="assuntos">${itens}</ul>` : `<p class="vazio">Ainda não há assuntos nesta matéria.</p>`}`;
  document.title = m.nome + " — Furlan Academy";
}

/* ============================================================
   NÍVEL 3 — assunto mostra temas, cada um com seus subtemas
   ============================================================ */
function telaAssunto(idMateria,idAssunto){
  const m = acharMateria(idMateria);
  const a = acharAssunto(m,idAssunto);
  if(!a) return telaErro();

  const temas = (a.temas || []).map((t,i) => {
    const subs = (t.subtemas || []).map(s => `
      <li>
        <a href="#/s/${esc(m.id)}/${esc(a.id)}/${esc(t.id)}/${esc(s.id)}" style="--cor:${esc(m.cor)}">
          <span class="marcador"></span>
          <span class="tit">${esc(s.titulo)}</span>
          <span class="seta">→</span>
          <span class="sub">${esc(s.resumo || "")}</span>
          ${selosDe(s)}
        </a>
      </li>`).join("");

    return `
      <section class="tema" style="--cor:${esc(m.cor)}">
        <div class="tema-cabeca">
          <span class="tema-num">Tema ${i + 1}</span>
          <h2>${esc(t.titulo)}</h2>
          ${t.resumo ? `<p>${esc(t.resumo)}</p>` : ""}
        </div>
        ${subs ? `<ul class="subtemas">${subs}</ul>` : `<p class="vazio">Este tema ainda não tem aulas.</p>`}
      </section>`;
  }).join("");

  app.innerHTML = `
    <p class="migalha"><a href="#/">Matérias</a> · <a href="#/m/${esc(m.id)}">${esc(m.nome)}</a> · ${esc(a.titulo)}</p>
    <div class="cabeca" style="--cor:${esc(m.cor)}">
      <div class="rotulo">${plural((a.temas || []).length,"tema","temas")} · ${plural(contarSubtemas(a),"aula","aulas")}</div>
      <h1>${esc(a.titulo)}</h1>
      <p>${esc(a.resumo || "")}</p>
    </div>
    ${temas || `<p class="vazio">Ainda não há temas neste assunto.</p>`}`;
  document.title = a.titulo + " — Furlan Academy";
}

/* ============================================================
   NÍVEL 4 — subtema, com as abas de conteúdo
   ============================================================ */
function telaSubtema(idMateria,idAssunto,idTema,idSubtema){
  const m = acharMateria(idMateria);
  const a = acharAssunto(m,idAssunto);
  const t = acharTema(a,idTema);
  const s = acharSubtema(t,idSubtema);
  if(!s) return telaErro();

  const videos = s.videos || [], escritas = s.escritas || [];
  const atividades = s.embaralharQuestoes
    ? embaralharLista(s.atividades || [])
    : (s.atividades || []);

  /* posição na sequência do assunto inteiro, para o botão de avançar */
  const sequencia = listarSubtemas(a);
  const pos = sequencia.findIndex(x => x.subtema === s);
  const proximo = sequencia[pos + 1];

  const paineis = [];

  if(videos.length){
    paineis.push({
      id:"videos", nome:"Vídeos", conta:videos.length,
      html: videos.map(v => {
        const cod = esc(codigoDoVideo(v.codigo));
        return `
        <div class="video">
          ${v.titulo ? `<h3>${esc(v.titulo)}</h3>` : ""}
          <div class="moldura">
            <iframe src="https://www.youtube-nocookie.com/embed/${cod}"
              title="${esc(v.titulo || "Vídeo da aula")}" allowfullscreen loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>
          </div>
          <a class="link-video" href="https://www.youtube.com/watch?v=${cod}"
            target="_blank" rel="noopener">Abrir no YouTube ↗</a>
        </div>`;
      }).join("")
    });
  }

  if(escritas.length){
    paineis.push({
      id:"leitura", nome:"Leitura", conta:escritas.length,
      html: escritas.map(e => `
        <article class="escrita">
          ${e.titulo ? `<h3>${esc(e.titulo)}</h3>` : ""}
          <div class="corpo">${e.texto}</div>
        </article>`).join("")
    });
  }

  if(atividades.length){
    paineis.push({
      id:"atividades", nome:"Atividades", conta:atividades.length,
      html: atividades.map((ex,i) => montarQuestao(ex,i,atividades.length)).join("") + `
        <div class="placar" id="placar" aria-live="polite">
          Nenhuma questão respondida ainda.
          <span>Responda as ${atividades.length} para ver seu resultado.</span>
        </div>`
    });
  }

  const abas = paineis.length > 1 ? `
    <nav class="abas" role="tablist">
      ${paineis.map((p,i) => `
        <button role="tab" id="aba-${p.id}" aria-controls="painel-${p.id}"
          aria-selected="${i === 0}" data-aba="${p.id}">
          ${esc(p.nome)} <span class="conta">${p.conta}</span>
        </button>`).join("")}
    </nav>` : "";

  const corpo = paineis.map((p,i) => `
    <div class="painel-aba" id="painel-${p.id}" role="tabpanel"
      aria-labelledby="aba-${p.id}" data-painel="${p.id}" ${i === 0 ? "" : "hidden"}>
      ${p.html}
    </div>`).join("");

  const linkProximo = proximo
    ? `#/s/${esc(m.id)}/${esc(a.id)}/${esc(proximo.tema.id)}/${esc(proximo.subtema.id)}`
    : null;

  app.innerHTML = `
    <p class="migalha">
      <a href="#/">Matérias</a> ·
      <a href="#/m/${esc(m.id)}">${esc(m.nome)}</a> ·
      <a href="#/as/${esc(m.id)}/${esc(a.id)}">${esc(a.titulo)}</a> ·
      ${esc(t.titulo)}
    </p>
    <article class="subtema">
      <h1>${esc(s.titulo)}</h1>
      ${s.resumo ? `<p class="resumo">${esc(s.resumo)}</p>` : ""}
      ${abas}
      ${corpo || `<p class="vazio">Esta aula ainda não tem conteúdo.</p>`}
      <div class="navegacao">
        ${linkProximo
          ? `<a class="avancar" href="${linkProximo}">Próxima aula: ${esc(proximo.subtema.titulo)} →</a>`
          : ""}
        <a class="voltar" href="#/as/${esc(m.id)}/${esc(a.id)}">← Todas as aulas de ${esc(a.titulo)}</a>
      </div>
    </article>`;

  document.title = s.titulo + " — Furlan Academy";
  ligarAbas();
  ligarAtividades(atividades);
  renderizarMatematica();
}

function ligarAbas(){
  const botoes = [...app.querySelectorAll(".abas button")];
  botoes.forEach(botao => {
    botao.addEventListener("click", () => {
      botoes.forEach(b => b.setAttribute("aria-selected", String(b === botao)));
      app.querySelectorAll(".painel-aba").forEach(p => {
        p.hidden = p.dataset.painel !== botao.dataset.aba;
      });
    });
  });
}

/* ============================================================
   QUESTÕES — quatro tipos
   ============================================================ */
const LETRAS = "ABCDEFGH";

const NOME_TIPO = {
  multipla:"escolha única", varias:"várias corretas",
  numerica:"resposta numérica", plano:"marcar no plano"
};

function montarQuestao(ex,i,total){
  const tipo = ex.tipo || "multipla";
  let miolo = "";

  if(tipo === "multipla" || tipo === "varias"){
    /* a ordem muda a cada vez, mas data-a guarda a posicao original,
       entao o gabarito continua valendo sem precisar mexer em nada */
    const ordem = embaralharLista((ex.alternativas || []).map((_,j) => j));
    miolo = `
      <div class="alternativas">
        ${ordem.map((original,posicao) => `
          <button class="alt" data-a="${original}">
            <span class="letra">${LETRAS[posicao]})</span>
            <span class="texto">${ex.alternativas[original]}</span>
          </button>`).join("")}
      </div>
      ${tipo === "varias" ? `<div class="acoes"><button type="button" class="btn btn--menor conferir">Conferir</button></div>` : ""}`;
  }

  if(tipo === "numerica"){
    miolo = `
      <div class="linha-resposta">
        <input type="text" inputmode="decimal" class="campo-numero" placeholder="Sua resposta" aria-label="Resposta numérica">
        ${ex.unidade ? `<span class="unidade">${esc(ex.unidade)}</span>` : ""}
        <button type="button" class="btn btn--menor conferir">Conferir</button>
      </div>`;
  }

  if(tipo === "plano"){
    miolo = `
      <div class="plano-caixa">
        ${desenharPlano(ex.intervalo || 6)}
        <div class="leitura-ponto">Ponto marcado: <b class="valor-ponto">nenhum</b></div>
      </div>
      <div class="acoes"><button type="button" class="btn btn--menor conferir" disabled>Conferir</button></div>`;
  }

  return `
    <div class="questao" data-q="${i}" data-tipo="${tipo}">
      <div class="ordem">
        <span class="rotulo">Questão ${i + 1} de ${total}</span>
        <span class="tipo-selo">${NOME_TIPO[tipo] || tipo}</span>
      </div>
      <div class="enunciado">${ex.pergunta}</div>
      ${ex.imagem ? `<img class="q-figura" src="${esc(ex.imagem)}" alt="Figura da questão ${i + 1}" loading="lazy">` : ""}
      ${miolo}
      <div class="area-resposta" aria-live="polite"></div>
    </div>`;
}

function desenharPlano(n){
  const T = 340, pad = 24, passo = (T - 2 * pad) / (2 * n);
  const px = x => pad + (x + n) * passo;
  const py = y => pad + (n - y) * passo;

  let grade = "", marcas = "";
  for(let i = -n; i <= n; i++){
    grade += `<line x1="${px(i)}" y1="${pad}" x2="${px(i)}" y2="${T - pad}" stroke="rgba(255,255,255,.07)" stroke-width="1"/>`;
    grade += `<line x1="${pad}" y1="${py(i)}" x2="${T - pad}" y2="${py(i)}" stroke="rgba(255,255,255,.07)" stroke-width="1"/>`;
    if(i !== 0 && n <= 8){
      marcas += `<text x="${px(i)}" y="${py(0) + 14}" fill="#697591" font-size="9" text-anchor="middle">${i}</text>`;
      marcas += `<text x="${px(0) - 7}" y="${py(i) + 3}" fill="#697591" font-size="9" text-anchor="end">${i}</text>`;
    }
  }

  return `
    <svg viewBox="0 0 ${T} ${T}" role="img" aria-label="Plano cartesiano de -${n} a ${n}. Toque para marcar um ponto."
      data-n="${n}" data-pad="${pad}" data-passo="${passo}" data-t="${T}">
      ${grade}
      <line x1="${pad}" y1="${py(0)}" x2="${T - pad}" y2="${py(0)}" stroke="#697591" stroke-width="1.5"/>
      <line x1="${px(0)}" y1="${pad}" x2="${px(0)}" y2="${T - pad}" stroke="#697591" stroke-width="1.5"/>
      <text x="${T - pad + 8}" y="${py(0) + 4}" fill="#98A5BE" font-size="12" font-style="italic">x</text>
      <text x="${px(0) - 4}" y="${pad - 8}" fill="#98A5BE" font-size="12" font-style="italic">y</text>
      ${marcas}
      <circle class="ponto-marcado" cx="0" cy="0" r="6" fill="#3ECF8E" opacity="0"/>
      <circle class="ponto-gabarito" cx="0" cy="0" r="6" fill="none" stroke="#FF7A6B" stroke-width="2" opacity="0"/>
    </svg>`;
}

function ligarAtividades(atividades){
  if(!atividades.length) return;
  const respondidas = new Array(atividades.length).fill(null);

  atividades.forEach((ex,i) => {
    const caixa = app.querySelector(`.questao[data-q="${i}"]`);
    if(!caixa) return;
    const tipo = ex.tipo || "multipla";

    const finalizar = acertou => {
      respondidas[i] = acertou;
      caixa.querySelector(".area-resposta").innerHTML = `
        <div class="resposta ${acertou ? "acertou" : "errou"}">
          <span class="veredito">${acertou ? "Isso mesmo." : "Ainda não."}</span>
          ${ex.explicacao || ""}
          ${ex.imagemExplicacao
            ? `<img class="img-explicacao" src="${esc(ex.imagemExplicacao)}"
                 alt="Figura da explicação" loading="lazy">`
            : ""}
        </div>`;
      renderizarMatematica(caixa.querySelector(".area-resposta"));
      atualizarPlacar(respondidas, atividades.length);
    };

    if(tipo === "multipla") ligarMultipla(caixa, ex, respondidas, i, finalizar);
    if(tipo === "varias")   ligarVarias(caixa, ex, respondidas, i, finalizar);
    if(tipo === "numerica") ligarNumerica(caixa, ex, respondidas, i, finalizar);
    if(tipo === "plano")    ligarPlano(caixa, ex, respondidas, i, finalizar);
  });
}

function ligarMultipla(caixa,ex,respondidas,i,finalizar){
  caixa.querySelectorAll(".alt").forEach(botao => {
    botao.addEventListener("click", () => {
      if(respondidas[i] !== null) return;
      const escolha = Number(botao.dataset.a);
      caixa.querySelectorAll(".alt").forEach(b => {
        b.disabled = true;
        const j = Number(b.dataset.a);
        if(j === ex.correta) b.classList.add("certa");
        else if(j === escolha) b.classList.add("errada");
      });
      finalizar(escolha === ex.correta);
    });
  });
}

function ligarVarias(caixa,ex,respondidas,i,finalizar){
  const marcadas = new Set();
  caixa.querySelectorAll(".alt").forEach(botao => {
    botao.addEventListener("click", () => {
      if(respondidas[i] !== null) return;
      const j = Number(botao.dataset.a);
      if(marcadas.has(j)) marcadas.delete(j); else marcadas.add(j);
      botao.classList.toggle("marcada", marcadas.has(j));
    });
  });

  caixa.querySelector(".conferir").addEventListener("click", () => {
    if(respondidas[i] !== null) return;
    if(!marcadas.size){
      caixa.querySelector(".area-resposta").innerHTML =
        `<div class="resposta"><span class="veredito">Marque pelo menos uma alternativa.</span></div>`;
      return;
    }
    const gabarito = new Set(ex.corretas || []);
    const acertou = marcadas.size === gabarito.size && [...marcadas].every(j => gabarito.has(j));

    caixa.querySelectorAll(".alt").forEach(b => {
      b.disabled = true;
      b.classList.remove("marcada");
      const j = Number(b.dataset.a);
      if(gabarito.has(j)) b.classList.add("certa");
      else if(marcadas.has(j)) b.classList.add("errada");
    });
    caixa.querySelector(".conferir").disabled = true;
    finalizar(acertou);
  });
}

function ligarNumerica(caixa,ex,respondidas,i,finalizar){
  const campo = caixa.querySelector(".campo-numero");
  const botao = caixa.querySelector(".conferir");

  const conferir = () => {
    if(respondidas[i] !== null) return;
    const bruto = campo.value.trim().replace(",",".");
    if(bruto === "" || isNaN(Number(bruto))){
      caixa.querySelector(".area-resposta").innerHTML =
        `<div class="resposta"><span class="veredito">Digite um número para conferir.</span></div>`;
      return;
    }
    const tol = ex.tolerancia === undefined ? 0.001 : ex.tolerancia;
    const acertou = Math.abs(Number(bruto) - Number(ex.resposta)) <= tol;
    campo.disabled = true; botao.disabled = true;
    finalizar(acertou);
  };

  botao.addEventListener("click", conferir);
  campo.addEventListener("keydown", e => { if(e.key === "Enter") conferir(); });
}

function ligarPlano(caixa,ex,respondidas,i,finalizar){
  const svg = caixa.querySelector("svg");
  const botao = caixa.querySelector(".conferir");
  const leitura = caixa.querySelector(".valor-ponto");
  const ponto = svg.querySelector(".ponto-marcado");
  const gabarito = svg.querySelector(".ponto-gabarito");

  const n = Number(svg.dataset.n), pad = Number(svg.dataset.pad);
  const passo = Number(svg.dataset.passo), T = Number(svg.dataset.t);
  const px = x => pad + (x + n) * passo;
  const py = y => pad + (n - y) * passo;

  let escolhido = null;

  svg.addEventListener("click", e => {
    if(respondidas[i] !== null) return;
    const r = svg.getBoundingClientRect();
    const bx = (e.clientX - r.left) * (T / r.width);
    const by = (e.clientY - r.top) * (T / r.height);
    let x = Math.round((bx - pad) / passo - n);
    let y = Math.round(n - (by - pad) / passo);
    x = Math.max(-n, Math.min(n, x));
    y = Math.max(-n, Math.min(n, y));

    escolhido = [x,y];
    ponto.setAttribute("cx", px(x));
    ponto.setAttribute("cy", py(y));
    ponto.setAttribute("opacity", "1");
    leitura.textContent = "(" + x + ", " + y + ")";
    botao.disabled = false;
  });

  botao.addEventListener("click", () => {
    if(respondidas[i] !== null || !escolhido) return;
    const certo = ex.resposta || [0,0];
    const acertou = escolhido[0] === certo[0] && escolhido[1] === certo[1];

    if(!acertou){
      gabarito.setAttribute("cx", px(certo[0]));
      gabarito.setAttribute("cy", py(certo[1]));
      gabarito.setAttribute("opacity", "1");
      leitura.innerHTML = `você marcou <b>(${escolhido[0]}, ${escolhido[1]})</b> — o correto é (${certo[0]}, ${certo[1]})`;
    }
    svg.classList.add("travado");
    botao.disabled = true;
    finalizar(acertou);
  });
}

function atualizarPlacar(respondidas,total){
  const feitas = respondidas.filter(r => r !== null).length;
  const certas = respondidas.filter(r => r === true).length;
  const placar = document.getElementById("placar");
  if(!placar) return;

  if(feitas < total){
    placar.innerHTML = `${certas} de ${feitas} certas até aqui.
      <span>Faltam ${plural(total - feitas,"questão","questões")}.</span>`;
    return;
  }
  const recado = certas === total ? "Aula dominada."
    : certas >= total / 2 ? "Quase lá — vale reler a parte que você errou."
    : "Vale reler a explicação com calma antes de seguir.";
  placar.innerHTML = `Você acertou ${certas} de ${total}. <span>${recado}</span>`;
}

const PALETA = [
  ["Azul","#5C8AF5"], ["Verde","#3ECF8E"], ["Coral","#F2765A"],
  ["Lilás","#C79BFF"], ["Âmbar","#FFC65C"], ["Turquesa","#4ECDE0"],

/* contraste WCAG entre duas cores, para avisar quando a cor livre
   deixar o número da aula ilegível */
function luminancia(hex){
  const c = hex.replace("#","");
  const v = [0,2,4].map(i => parseInt(c.slice(i,i+2),16)/255)
    .map(x => x <= 0.03928 ? x/12.92 : Math.pow((x+0.055)/1.055, 2.4));
  return 0.2126*v[0] + 0.7152*v[1] + 0.0722*v[2];
}
function contraste(a,b){
  const l1 = luminancia(a), l2 = luminancia(b);
  return (Math.max(l1,l2) + 0.05) / (Math.min(l1,l2) + 0.05);
}

/* escreve um trecho na posição do cursor do campo */
function inserirNoCampo(campo, texto){
  const i = campo.selectionStart === undefined ? campo.value.length : campo.selectionStart;
  const j = campo.selectionEnd === undefined ? i : campo.selectionEnd;
  campo.value = campo.value.slice(0,i) + texto + campo.value.slice(j);
  campo.focus();
  const fim = i + texto.length;
  campo.setSelectionRange(fim, fim);
}

  function conferir(hex){
    const c = contraste(hex, "#08121F");
    aviso.innerHTML = c >= 4.5 ? "" :
      `<p class="aviso-contraste">Essa cor é escura demais: o número da aula fica difícil
       de ler em cima dela. Prefira um tom mais claro.</p>`;
  }

  function aplicar(hex, rotulo){
    guardado.value = hex;
    livre.value = hex;
    nome.textContent = rotulo;
    nome.style.color = hex;
    amostras.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cor === hex)));
    conferir(hex);

  amostras.forEach(b => {
    b.addEventListener("click", () => aplicar(b.dataset.cor, b.title));
  });

}

/* acrescenta uma linha de alternativa na lista */
function novaAlternativa(lista){
  if(!lista || lista.children.length >= LETRAS.length) return;
  const varias = lista.dataset.varias === "true";
  const grupo = lista.dataset.grupo;
  const primeira = lista.children.length === 0;

  const linha = document.createElement("div");
  linha.className = "alt-linha";
  linha.innerHTML = `
    <span class="alt-letra"></span>
    <input class="q-alt" placeholder="Texto da alternativa">
    <label class="certinha alt-marca">
      <input type="${varias ? "checkbox" : "radio"}" class="q-certa"
        ${varias ? "" : `name="${grupo}"`} ${(!varias && primeira) ? "checked" : ""}>
      <span>${varias ? "correta" : "é a certa"}</span>
    </label>
    <button type="button" class="btn--apagar tirar-alt" title="Remover esta alternativa">✕</button>`;

  lista.appendChild(linha);
  renumerarAlternativas(lista);
}

function renumerarAlternativas(lista){
  const linhas = [...lista.children];
  linhas.forEach((l,i) => {
    l.querySelector(".alt-letra").textContent = LETRAS[i] + ")";
    l.querySelector(".q-alt").placeholder = "Alternativa " + LETRAS[i];
    l.querySelector(".tirar-alt").style.visibility = linhas.length > 2 ? "visible" : "hidden";
  });
  const botao = lista.parentElement.querySelector(".add-alt");
  if(botao) botao.disabled = linhas.length >= LETRAS.length;

  /* se a correta foi removida numa questão de escolha única, marca a primeira */
  const radios = [...lista.querySelectorAll('input[type="radio"]')];
  if(radios.length && !radios.some(r => r.checked)) radios[0].checked = true;
}

/* ---------- escrita simples → HTML ---------- */
function textoParaHtml(bruto, junta){
  const separador = junta === undefined ? "\n                    " : junta;
  const partes = String(bruto).trim().split(/\n\s*\n/);
  return partes.map(p => {
    const linhas = p.trim().split("\n").map(l => l.trim());

    /* ![legenda](imagens/arquivo.png) — uma ou mais, em qualquer ponto do texto */
    const IMG = /^!\[([^\]]*)\]\(([^)\s]+)\)$/;
    if(linhas.every(l => IMG.test(l))){
      return linhas.map(l => {
        const achado = l.match(IMG);
        const legenda = achado[1].trim(), caminho = achado[2].trim();
        return `<figure class="figura">`
          + `<img src="${escLeve(caminho)}" alt="${escLeve(legenda.replace(/[*`$]/g,""))}" loading="lazy">`
          + (legenda ? `<figcaption>${rico(legenda)}</figcaption>` : "")
          + `</figure>`;
      }).join("");
    }

    if(linhas.every(l => l.startsWith(">"))){
      /* cada linha da citação vira uma linha na tela — versos e diálogos
         precisam disso; prosa comum é digitada numa linha só mesmo */
      return "<blockquote>" + linhas.map(l => rico(l.replace(/^>\s*/,""))).join("<br>") + "</blockquote>";
    }
    if(linhas.every(l => l.startsWith("-"))){
      return "<ul>" + linhas.map(l => `<li>${rico(l.replace(/^-\s*/,""))}</li>`).join("") + "</ul>";
    }
    if(linhas.every(l => /^\d+[.)]\s/.test(l))){
      return "<ol>" + linhas.map(l => `<li>${rico(l.replace(/^\d+[.)]\s*/,""))}</li>`).join("") + "</ol>";
    }
    if(linhas.length === 1 && linhas[0].startsWith("##")){
      return `<h4>${rico(linhas[0].replace(/^#+\s*/,""))}</h4>`;
    }
    if(linhas.length === 1 && /^\$\$[\s\S]*\$\$$/.test(linhas[0])){
      return linhas[0];
    }
    return `<p>${rico(linhas.join(" "))}</p>`;
  }).join(separador);
}

function escLeve(t){
  return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* converte **negrito**, *itálico* e `código`.
   As fórmulas entre cifrões saem de cena antes da conversão e voltam
   depois, para o asterisco de uma multiplicação nunca virar itálico. */
function estilizar(t){
  const guardadas = [];
  let x = String(t).replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g, achado => {
    guardadas.push(achado);
    return "\u0001" + (guardadas.length - 1) + "\u0001";
  });

  x = x.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  x = x.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  x = x.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");

  return x.replace(/\u0001(\d+)\u0001/g, (_, i) => guardadas[Number(i)]);
}

/* texto digitado -> HTML seguro e estilizado */
function rico(t){ return estilizar(escLeve(t)); }

/* ---------- montar o código ---------- */
function aspas(t){ return JSON.stringify(String(t || "")); }
function crase(t){
  return "`" + String(t || "").replace(/\\/g,"\\\\").replace(/`/g,"\\`").replace(/\$\{/g,"\\${") + "`";
}
function numero(t,padrao){
  const v = String(t || "").trim().replace(",",".");
  return v === "" || isNaN(Number(v)) ? padrao : Number(v);
}
function valor(sel){ const e = app.querySelector(sel); return e ? e.value.trim() : ""; }

function bloco(q){
  const L = [`                  tipo: ${aspas(q.tipo)}`, `                  pergunta: ${aspas(q.pergunta)}`];
  if(q.imagem) L.push(`                  imagem: ${aspas(q.imagem)}`);

  if(q.tipo === "multipla"){
    L.push(`                  alternativas: [${q.alternativas.map(aspas).join(", ")}]`);
    L.push(`                  correta: ${q.correta}`);
  }
  if(q.tipo === "varias"){
    L.push(`                  alternativas: [${q.alternativas.map(aspas).join(", ")}]`);
    L.push(`                  corretas: [${q.corretas.join(", ")}]`);
  }
  if(q.tipo === "numerica"){
    L.push(`                  resposta: ${q.resposta}`);
    if(q.unidade) L.push(`                  unidade: ${aspas(q.unidade)}`);
    L.push(`                  tolerancia: ${q.tolerancia}`);
  }
  if(q.tipo === "plano"){
    L.push(`                  resposta: [${q.resposta[0]}, ${q.resposta[1]}]`);
    L.push(`                  intervalo: ${q.intervalo}`);
  }
  L.push(`                  explicacao: ${aspas(q.explicacao)}`);
  if(q.imagemExplicacao) L.push(`                  imagemExplicacao: ${aspas(q.imagemExplicacao)}`);
  return "                {\n" + L.join(",\n") + "\n                }";
}

function avisar(saida,mensagem){
  saida.innerHTML = `<div class="instrucao">${mensagem}</div>`;
}

function mostrar(saida,codigo,instrucao){
  saida.innerHTML = `
    <div class="instrucao">${instrucao}</div>
    <textarea id="codigo" readonly spellcheck="false"></textarea>
    <div class="acoes"><button type="button" class="btn btn--principal" id="copiar">Copiar código</button></div>`;
  saida.querySelector("#codigo").value = codigo;

  saida.querySelector("#copiar").addEventListener("click", async () => {
    const area = saida.querySelector("#codigo"), botao = saida.querySelector("#copiar");
    try{ await navigator.clipboard.writeText(area.value); }
    catch(e){ area.select(); document.execCommand("copy"); }
    botao.textContent = "Copiado";
    setTimeout(() => botao.textContent = "Copiar código", 1800);
  });
  saida.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function rotear(){
  const p = location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  window.scrollTo(0,0);

  document.getElementById("nav-inicio").classList.toggle("ativo", p[0] !== "criar");
  document.getElementById("nav-criar").classList.toggle("ativo", p[0] === "criar");

  if(p[0] === "criar") return telaCriar();
  if(p[0] === "m"  && p[1]) return telaMateria(p[1]);
  if(p[0] === "as" && p[1] && p[2]) return telaAssunto(p[1],p[2]);
  if(p[0] === "s"  && p[1] && p[2] && p[3] && p[4]) return telaSubtema(p[1],p[2],p[3],p[4]);
  return telaCapa();
}

window.addEventListener("hashchange", rotear);
rotear();
